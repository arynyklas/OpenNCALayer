name: tmp artifact check
on:
  push:
    branches: [ci/mac-smoke]
permissions:
  contents: read
  actions: read
jobs:
  c:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          gh run download 43916452587 --repo "$GITHUB_REPOSITORY" -n release-packages-osx --dir d
          ls -l d
          gh attestation verify d/openncalayer-0.1.0-rc.3-osx.pkg --repo "$GITHUB_REPOSITORY" | tail -n 3
