name: TUF expiry

# The weekly reminder: `cargo xtask tuf check --fail-on-expiring` on `main` fails (and
# GitHub mails the failure of a scheduled run) when the targets, or the snapshot while it is
# offline (`tuf/v1.toml`), expire in less than 10 days (the owner signs a new version:
# `cargo xtask tuf update --refresh`, monthly), or the root in less than 45 days
# (`cargo xtask tuf root`, yearly), or any of them has expired. Once the snapshot is online,
# Pages signs it for a week on every run, as the timestamp, and the tree has none to check.
# It reads only the committed tree: the online snapshot and the timestamp are Pages' business
# (the daily Pages run goes red when they cannot be signed or published). With no `tuf/v1`
# and no anchor yet (before the owner's ceremony) it passes. No secret is used or reachable
# here.
#
# The same check reads the newest role of every publisher in `tuf/v1`. The expiry of a
# publisher's role only warns (`warning[role-expired]`, `warning[role-expiring]` become
# annotations of the run, which stays green): the publisher signs a new one, and an expiring
# role does not stop the publication. Other findings about the publishers are errors and fail
# this run, as they stop the publication by Pages (it signs nothing over a role that fails).
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  expiry:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: pages
      - name: Check the expiry
        run: |
          status=0
          cargo xtask tuf check --no-timestamp --fail-on-expiring --min-days 10 --min-root-days 45 \
            > "$RUNNER_TEMP/expiry.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/expiry.log"
          while read -r line; do
            case "$line" in
              *"warning[role-expired]"* | *"warning[role-expiring]"*) echo "::warning::$line" ;;
            esac
          done < "$RUNNER_TEMP/expiry.log"
          exit "$status"
