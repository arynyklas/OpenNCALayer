name: CI

on:
  # `push` only for main: a pull request is checked by its own `pull_request` run, and a
  # branch push next to it ran the whole workflow a second time on the same commit.
  push:
    branches: [main]
  # `labeled`: adding the `full-ci` label starts the full run on the pull request. Any other
  # label starts the ordinary run again and cancels the one in progress.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Every night: the full run on main (macOS included).
    - cron: "30 2 * * *"
  # A full run. `check` passes only on main: a manual run elsewhere is for looking, not for
  # the required status. `live` and `bench` are in scheduled.yml.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the older run of the same pull request. Every other
# run (a push to main, the scheduled and the manual ones) has its own group, the commit and
# the event: with one group per branch GitHub cancels a run that is still waiting behind the
# running one as soon as a newer one is queued (seen on 2026-11-14: the run of a merge
# commit never started and was cancelled one second after the next merge), and a commit on
# main is left unchecked.
concurrency:
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}-{2}', github.sha, github.event_name, github.event.schedule) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Line tables keep file:line in backtraces; full debug info makes linking the test
  # binaries (above all on Windows), the archives and the caches much slower.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # A test whose oracle (Python with pyHanko, OpenSSL 3, keytool, certutil, git) is missing
  # fails here instead of skipping (docs/dev/development.md, «Что нужно для тестов»).
  ONCL_REQUIRE_ORACLES: "1"

jobs:
  # What this run checks. Every other job runs on one of these outputs, and `check` reads the
  # same outputs to tell a job skipped on purpose from one that had to run.
  # - full: a push to main, the nightly run, a manual run, a pull request labelled `full-ci`.
  #   Everything runs, macOS included.
  # - a pull request: the Rust jobs unless it changes documentation only; the packaging jobs
  #   and `builtins-x86` only if it changes what they build from (the app and xtask code,
  #   Cargo files, the toolchain, .cargo/, the workflows); one macOS job (`test-macos`).
  # `fmt`, `privacy`, `index` and `actionlint` run on every run.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.what.outputs.rust }}
      site: ${{ steps.what.outputs.site }}
      app: ${{ steps.what.outputs.app }}
      full: ${{ steps.what.outputs.full }}
      mac_pr: ${{ steps.what.outputs.mac_pr }}
      release_plugins: ${{ steps.what.outputs.release_plugins }}
      test_oses: ${{ steps.what.outputs.test_oses }}
    steps:
      # The merge commit of a pull request and its first parent, the base it merges into.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: What to run
        id: what
        env:
          EVENT: ${{ github.event_name }}
          FULL_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          case "$EVENT" in
            pull_request) full="$FULL_CI_LABEL" ;;
            push | schedule | workflow_dispatch) full=true ;;
            *) echo "::error::unexpected event $EVENT"; exit 1 ;;
          esac
          rust=false site=false app=false
          if [ "$full" = true ]; then
            rust=true site=true app=true
          else
            # NUL-separated, unquoted: any file name reads as it is. --no-renames: a file moved
            # out of a path counts as changed there.
            echo "changed:"
            while IFS= read -r -d '' file; do
              echo "  $file"
              [ -n "$file" ] || continue
              case "$file" in
                # Documentation that no build, test or package reads (xtask's forks test
                # reads docs/dev/sdk*.md).
                docs/dev/sdk*.md) rust=true ;;
                docs/* | .agents/* | AGENTS.md | CLAUDE.md | CHANGELOG.md | CONTRIBUTING.md \
                  | SECURITY.md | .github/ISSUE_TEMPLATE/* | .github/PULL_REQUEST_TEMPLATE*) ;;
                # The indexes and the TUF repository: the index check (always) and the site.
                updates/* | tuf/*) site=true ;;
                *) rust=true ;;
              esac
              # What the packaging jobs and `builtins-x86` build from (web/: the daemon's pages).
              case "$file" in
                crates/* | xtask/* | web/* | deploy/* | .cargo/* | .github/workflows/* | .github/actions/* \
                  | Cargo.toml | Cargo.lock | rust-toolchain.toml | .gitattributes \
                  | README.md | LICENSE | NOTICE) app=true ;;
              esac
            done < <(git -c core.quotePath=false diff -z --name-only --no-renames HEAD^1 HEAD)
            if [ "$rust" = true ]; then site=true; fi
          fi
          mac_pr=false release_plugins=false
          if [ "$rust" = true ] && [ "$full" != true ]; then mac_pr=true; fi
          if [ "$full" = true ] && [ "$EVENT" != pull_request ]; then release_plugins=true; fi
          if [ "$full" = true ]; then
            test_oses='["ubuntu-24.04","windows-2025","macos-15"]'
          else
            test_oses='["ubuntu-24.04","windows-2025"]'
          fi
          {
            echo "rust=$rust"
            echo "site=$site"
            echo "app=$app"
            echo "full=$full"
            echo "mac_pr=$mac_pr"
            echo "release_plugins=$release_plugins"
            echo "test_oses=$test_oses"
          } | tee -a "$GITHUB_OUTPUT"

  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path crates/oncl-pdk/example/Cargo.toml --check
      - name: cargo fmt (plugin ports)
        run: cargo fmt --manifest-path plugins/Cargo.toml --all --check

  # `cargo xtask privacy` (privacy.yml): every run, no path filter. The heavy jobs wait for
  # it and for `fmt`.
  privacy:
    uses: ./.github/workflows/privacy.yml
    secrets:
      PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}

  # The update indexes and the TUF repository (index-check.yml): every run. It decides itself
  # whether `updates/`, `tuf/` or the keys changed (without a base, outside pull requests and
  # pushes, it checks the tree as it is), so no path filter skips it.
  index:
    permissions:
      contents: read
      # The commit statuses of release tags (`vm-smoke`, `conformance`), read through the API.
      statuses: read
    uses: ./.github/workflows/index-check.yml

  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # shellcheck comes with the runner image; actionlint runs it over the `run:` scripts.
      - name: actionlint
        run: |
          curl -sSfLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color .github/workflows/*.yml

  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      # The plugin ports' own lock file, under the core's rules.
      - name: cargo deny of the plugin ports
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: plugins/Cargo.toml
          arguments: --all-features --config deny.toml

  # Once per run, on Linux, for every job after it: the built-in modules' WebAssembly
  # (`cargo xtask builtins build`, artifact `builtins`) and the NCANode fixtures
  # (`cargo xtask fetch-fixtures`, artifact `ncanode-fixtures`). The builds embed the
  # modules from `ONCL_BUILTINS_DIR` as release.yml does: `oncl-builtins-build` takes them
  # only if they were built from the same sources with the same toolchain (`SOURCE-SHA256`)
  # and match their `SHA256SUMS`, on every OS; the bytes are the Linux build's, the ones a
  # release publishes. The test jobs need no xtask build for the fixtures.
  prepare:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      # xtask's build, shared by the Linux jobs that build only xtask (privacy, site,
      # extension, tokens-vpcd); this job alone saves it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-dev
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Built-in modules
        run: cargo xtask builtins build
      - name: NCANode fixtures
        run: cargo xtask fetch-fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: builtins
          path: target/builtins/
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: ncanode-fixtures
          path: target/fixtures/ncanode/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  clippy:
    needs: [changes, fmt, privacy, prepare]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ONCL_BUILTINS_DIR: ${{ github.workspace }}/target/builtins
    steps:
      - uses: actions/checkout@v5
      # The window system's development files for slint and winit (fontconfig, xkbcommon,
      # wayland in Cargo.lock); nothing links GTK.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: actions/download-artifact@v5
        with:
          name: builtins
          path: target/builtins
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Clippy of the example plugin (wasm32)
        run: cargo clippy --locked --manifest-path crates/oncl-pdk/example/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy of the guest SDK (wasm32)
        run: cargo clippy --locked -p oncl-pdk --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy of the built-in modules (wasm32)
        run: cargo clippy --locked -p oncl-builtin-accessory -p oncl-builtin-basics -p oncl-builtin-commonutils -p oncl-builtin-applet --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy of the plugin ports (wasm32)
        run: cargo clippy --locked --manifest-path plugins/Cargo.toml --workspace --target wasm32-unknown-unknown -- -D warnings
      - name: Tests of the ports' shared libraries
        run: cargo test --locked --manifest-path plugins/Cargo.toml -p oncl-port-kit -p oncl-port-pki

  # The `clippy` job runs on Linux and never sees `cfg(windows)` code (oncl-ui foreground):
  # this one lints it next to the tests.
  clippy-windows:
    needs: [changes, fmt, privacy, prepare]
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      ONCL_BUILTINS_DIR: ${{ github.workspace }}/target/builtins
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: actions/download-artifact@v5
        with:
          name: builtins
          path: target/builtins
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # The workspace's tests, built once per OS and run in three slices (`test`). This job
  # builds every test binary with cargo-nextest (`cargo nextest archive`, the `ci` profile
  # of .config/nextest.toml) and uploads the archive (`nextest-<os>`). macOS is here only in
  # a full run; a pull request has `test-macos` instead.
  test-build:
    needs: [changes, fmt, privacy, prepare]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.test_oses) }}
    name: test-build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      ONCL_BUILTINS_DIR: ${{ github.workspace }}/target/builtins
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      # One cache per OS, saved by this job from main only.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: tests-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: ./.github/actions/install-nextest
      - uses: actions/download-artifact@v5
        with:
          name: builtins
          path: target/builtins
      - name: Build the tests
        shell: bash
        run: cargo nextest archive --workspace --all-features --locked --archive-file "$RUNNER_TEMP/nextest.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-${{ matrix.os }}
          path: ${{ runner.temp }}/nextest.tar.zst
          if-no-files-found: error
          retention-days: 3
          # zstd already.
          compression-level: 0
          overwrite: true
      # `oncl-core`'s examples test runs `cargo run --example` of this workspace: it needs
      # the build tree this job has, so it runs here and not from the archive.
      - name: Tests that need the build tree
        shell: bash
        run: |
          cargo nextest run --profile ci --workspace --all-features --locked --run-ignored all \
            -E 'binary_id(oncl-core::examples)'

  # The archive of `test-build`, one third of the tests per job (`--partition slice:N/3`).
  # Every ignored test runs here (`--run-ignored all`), fixtures and oracles included, except
  # those the `ci` profile's `default-filter` names; the parity tests of oncl-ui run the
  # `oncl` binary from the archive (target/debug/oncl). Built-in modules' benchmarks run in
  # `bench`.
  test:
    needs: [changes, prepare, test-build]
    # One OS's failed build leaves the other OSes' slices running.
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && needs.prepare.result == 'success' && needs.test-build.result != 'skipped' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.test_oses) }}
        partition: [1, 2, 3]
    name: test (${{ matrix.os }}, ${{ matrix.partition }}/3)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      # What the test binaries load at run time (the runner image has them; installed only
      # if one is missing).
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          libs=(libfontconfig1 libxkbcommon0 libwayland-client0)
          if ! dpkg -s "${libs[@]}" > /dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${libs[@]}"
          fi
      # Tests build the example plugin, the plugin ports and the Windows 7 DLLs with cargo.
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/install-nextest
      - uses: actions/download-artifact@v5
        with:
          name: nextest-${{ matrix.os }}
          path: ${{ runner.temp }}/nextest
      - uses: actions/download-artifact@v5
        with:
          name: ncanode-fixtures
          path: target/fixtures/ncanode
      - uses: ./.github/actions/test-oracles
      # Every platform's packages, which tests read offline from the cargo registry: the
      # licences tests (`committed_licenses_are_fresh`, `committed_plugin_licenses_are_fresh`)
      # and the SDK's closure and inventory tests (`cargo tree --offline`, the inventory with
      # `--target` of every platform). This job builds nothing, so its registry is empty on
      # every OS without this step. Under half a minute on Linux, about a minute on Windows,
      # most of it unpacking: no cache, which would save little of that and share the
      # repository's cache space with the test builds' caches.
      - name: Fetch packages
        # bash (`-e`) on every OS: pwsh would fail the step on the last command's code only.
        shell: bash
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path plugins/Cargo.toml
      - name: Test
        shell: bash
        run: |
          # Extracted into the workspace's own target/, where the tests look for the
          # programs and the fixtures (and leave the downloaded fixtures alone). Tests write
          # into their `CARGO_TARGET_TMPDIR` (target/tmp), which cargo makes at build time.
          mkdir -p target/tmp
          cargo nextest run --profile ci --archive-file "$RUNNER_TEMP/nextest/nextest.tar.zst" \
            --workspace-remap . --extract-to . --extract-overwrite \
            --partition "slice:${{ matrix.partition }}/3" --run-ignored all \
            -E 'not binary_id(oncl-core::examples)'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ matrix.os }}-${{ matrix.partition }}-${{ github.run_attempt }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # A pull request's one macOS job: the crates with macOS code of their own (the tray, the
  # wizard, the trust store, PC/SC, the updater, the IPC, TLS, the plugin host, the desktop
  # integration) and the CLI, whose binary the UI parity tests run. The whole suite runs on
  # macOS in a full run (`test-build`, `test`): on main, every night, with the `full-ci` label.
  test-macos:
    needs: [changes, fmt, privacy, prepare]
    if: needs.changes.outputs.mac_pr == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ONCL_BUILTINS_DIR: ${{ github.workspace }}/target/builtins
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      # The full run's cache (saved from main); a pull request saves nothing.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: tests-macos-15
          save-if: false
      - uses: ./.github/actions/install-nextest
      - uses: actions/download-artifact@v5
        with:
          name: builtins
          path: target/builtins
      - uses: actions/download-artifact@v5
        with:
          name: ncanode-fixtures
          path: target/fixtures/ncanode
      - uses: ./.github/actions/test-oracles
      - name: Test
        run: |
          cargo nextest run --profile ci --locked --all-features --run-ignored all \
            -p oncl-desktop -p oncl-ipc -p oncl-token -p oncl-trust -p oncl-ui -p oncl-update \
            -p oncl-plugin -p oncl-tls -p oncl-cli
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: junit-macos-pr-${{ github.run_attempt }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # The built-in modules' tests again with no markers for the long strings of a request (the
  # modules read them as the tests sent them): the same tests pass both ways. The modules run
  # in the same interpreter on every OS, so this second pass runs on Linux only, from the
  # Linux archive, next to the slices.
  no-markers:
    needs: [changes, prepare, test-build]
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && needs.prepare.result == 'success' && needs.test-build.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ONCL_TEST_NO_MARKERS: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/install-nextest
      - uses: actions/download-artifact@v5
        with:
          name: nextest-ubuntu-24.04
          path: ${{ runner.temp }}/nextest
      - uses: actions/download-artifact@v5
        with:
          name: ncanode-fixtures
          path: target/fixtures/ncanode
      - uses: ./.github/actions/test-oracles
      - name: Built-in modules without markers
        run: |
          mkdir -p target/tmp
          cargo nextest run --profile ci --archive-file "$RUNNER_TEMP/nextest/nextest.tar.zst" \
            --workspace-remap . --extract-to . --extract-overwrite -E 'package(oncl-builtin-tests)'

  # The plugin tests with the ports built in the `release` profile (fat LTO, as `plugin pack`
  # ships them) instead of `plugin-test`, and the operations lint against those modules, the
  # bytes that ship: on main and every night, from the Linux archive.
  plugins-release:
    needs: [changes, prepare, test-build]
    if: ${{ !cancelled() && needs.changes.outputs.release_plugins == 'true' && needs.prepare.result == 'success' && needs.test-build.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ONCL_PORTS_PROFILE: release
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/install-nextest
      - uses: actions/download-artifact@v5
        with:
          name: nextest-ubuntu-24.04
          path: ${{ runner.temp }}/nextest
      - uses: actions/download-artifact@v5
        with:
          name: ncanode-fixtures
          path: target/fixtures/ncanode
      - uses: ./.github/actions/test-oracles
      - name: Port tests (release profile)
        run: |
          mkdir -p target/tmp
          cargo nextest run --profile ci --archive-file "$RUNNER_TEMP/nextest/nextest.tar.zst" \
            --workspace-remap . --extract-to . --extract-overwrite --run-ignored all \
            -E 'package(oncl-port-tests) | binary_id(openncalayer::ports_e2e) | binary_id(openncalayer::ports_heavy_e2e) | binary_id(oncl-core::plugin_ports_manual)'
      # The ports the tests above built (a no-op build then), linted as they ship.
      - name: Plugin operations lint (release modules)
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown --workspace \
            --manifest-path plugins/Cargo.toml --target-dir target/plugin-ports
          cargo xtask plugin-ops-check --require-wasm --wasm-dir target/plugin-ports/wasm32-unknown-unknown/release

  # The Linux checks outside the test binaries.
  linux-checks:
    needs: [changes, fmt, privacy, prepare]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ONCL_BUILTINS_DIR: ${{ github.workspace }}/target/builtins
    steps:
      - uses: actions/checkout@v5
        with:
          # The tags: `plugin-version-check` compares the ports with the last `plugins-*` tag
          # (docs/dev/plugin-version-check.md); without one it only prints a NOTICE.
          fetch-depth: 0
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      # The Linux test build's dependencies (saved by `test-build`).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: tests-ubuntu-24.04
          save-if: false
      - uses: actions/download-artifact@v5
        with:
          name: builtins
          path: target/builtins
      # nextest does not run doctests. Linux runs them here on every run with Rust changes;
      # Windows and macOS in `doctests`, in full runs.
      - name: Doctests
        run: cargo test --locked --workspace --all-features --doc
      # The daemon as releases build it (no `e2e-prompter`, no `token-emulator`): the token
      # emulator's variable changes nothing.
      - name: Daemon without the test features
        run: cargo test --locked -p openncalayer --lib release_build_ignores_emulator_var
      # The app-local DLLs of the Windows 7 builds are workspace members; on Windows their
      # tests build them.
      - name: Build the Windows 7 app-local DLLs
        run: cargo build --locked -p oncl-win7shim-combase -p oncl-win7shim-winrt-error
      - name: CMS interop with OpenSSL
        run: cargo xtask interop-openssl
      # Offline and read-only: `cargo tree -p <program> -e normal -f "{p} [{f}]"` of the four
      # release programs (openncalayer, oncl-cli, oncl-server, oncl-ui) must show the `testing`
      # feature on no crate. Releases build with `-p`, but `cargo build --workspace
      # --all-targets` and `cargo test` unify the dev-dependencies' `testing` into the same
      # binaries; this fails if it ever reaches the normal tree (`for_tests` constructors forge
      # key-use approvals).
      - name: No testing feature in release programs
        run: cargo xtask check-release-features
      # Offline and read-only (about 3 s): the SDK's dependency closure against the forbidden
      # crates. `cargo xtask sdk smoke` (packs and builds the chain, about 75 s warm) stays a
      # manual gate: its offline consumer resolve was not tried against a cold CI cache.
      - name: SDK dependency closure
        run: cargo xtask sdk closure
      # The lint of the `[[operations]]` of every `plugins/*/plugin.toml` against the modules
      # (the `plugin-test` profile the port tests build too); a missing module is an error.
      # The same ports run under the manual window's call path in `plugin_ports_manual`
      # (docs/dev/plugins-manual-tests.md): its `#[ignore]`d tests run in `test`.
      - name: Plugin operations lint
        run: |
          cargo build --locked --profile plugin-test --target wasm32-unknown-unknown --workspace \
            --manifest-path plugins/Cargo.toml --target-dir target/plugin-ports
          cargo xtask plugin-ops-check --require-wasm --wasm-dir target/plugin-ports/wasm32-unknown-unknown/plugin-test
      - name: Plugin versions bumped
        run: cargo xtask plugin-version-check

  # The doctests on Windows and macOS (nextest does not run them): full runs only (main,
  # nightly, manual `full`, `full-ci`). Linux runs them in `linux-checks` on every run.
  doctests:
    needs: [changes, fmt, privacy, prepare]
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    name: doctests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ONCL_BUILTINS_DIR: ${{ github.workspace }}/target/builtins
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      # The test build's dependencies on this OS (saved by `test-build`).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: tests-${{ matrix.os }}
          save-if: false
      - uses: actions/download-artifact@v5
        with:
          name: builtins
          path: target/builtins
      - name: Doctests
        run: cargo test --locked --workspace --all-features --doc

  # The built-in modules' limits in a 32-bit process, where their memory is smallest.
  builtins-x86:
    needs: [changes, fmt, privacy, prepare]
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      ONCL_BUILTINS_DIR: ${{ github.workspace }}/target/builtins
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add i686-pc-windows-msvc
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: actions/download-artifact@v5
        with:
          name: builtins
          path: target/builtins
      - name: Limits
        run: cargo test --locked --target i686-pc-windows-msvc -p oncl-builtin-tests --test limits

  # The real PC/SC backend (libpcsclite opened at run time) against an emulated Kaztoken:
  # pcscd with vsmartcard's virtual reader (a CI tool only: not linked, not shipped), the
  # card served by `cargo xtask token-emu`.
  tokens-vpcd:
    needs: [changes, fmt, privacy]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install pcscd and vpcd
        run: |
          sudo apt-get update
          if ! sudo apt-get install -y --no-install-recommends pcscd vsmartcard-vpcd; then
            echo "::error::pcscd or vsmartcard-vpcd is not installable on this runner image"
            exit 1
          fi
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-dev
          save-if: false
      - name: Build
        run: |
          cargo build -p xtask
          cargo test --no-run -p oncl-token --features emulator --test vpcd
      - name: Test against the emulated Kaztoken
        run: |
          # The packaged pcscd is socket-activated and exits when idle (--auto-exit): stop
          # it and run one for the whole step (the polkit check is for desktop sessions),
          # then serve the card to its vpcd reader. The tests wait for the card to appear;
          # one at a time, as they share the card.
          sudo systemctl stop pcscd.socket pcscd.service 2>/dev/null || true
          # The log belongs to the runner user, not root: the redirect is meant.
          # shellcheck disable=SC2024
          sudo pcscd --foreground --disable-polkit > pcscd.log 2>&1 &
          cargo xtask token-emu --config crates/oncl-token/tests/vpcd-kaztoken.toml \
            > token-emu.log 2>&1 &
          status=0
          ONCL_TOKEN_VPCD=1 cargo test -p oncl-token --features emulator --test vpcd \
            -- --test-threads=1 || status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- pcscd"; cat pcscd.log
            echo "--- token-emu"; cat token-emu.log
          fi
          exit "$status"

  # The project site (`site/`): built with the pinned Zola from the committed ports and the
  # fixtures, and checked offline. Publishing is `pages.yml`'s.
  site:
    needs: [changes, fmt, privacy]
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-dev
          save-if: false
      # The `zola_` tests (ignored, they download Zola) run here, not in `test`.
      - run: cargo xtask registry build
      - run: cargo test -p xtask --test registry_site -- --ignored zola_

  extension:
    needs: [changes, fmt, privacy]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # A glob, not the directory: since Node 21 `--test` arguments are patterns.
      - run: node --test "extension/test/*.test.mjs"
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-dev
          save-if: false
      - run: cargo xtask ext build

  # The extension in Chrome for Testing, Firefox and Firefox ESR 115, over native messaging to
  # the daemon.
  ext-e2e:
    needs: [changes, fmt, privacy, prepare]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ONCL_BUILTINS_DIR: ${{ github.workspace }}/target/builtins
    steps:
      - uses: actions/checkout@v5
      # libdbus-glib-1-2: Firefox ESR 115 links libdbus-glib-1.so.2 (later Firefox does not).
      # libgtk-3-0t64: the browsers' own GTK (the runner image has it; named so that it stays).
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libdbus-glib-1-2 libgtk-3-0t64
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: actions/download-artifact@v5
        with:
          name: builtins
          path: target/builtins
      - run: cargo build --release -p openncalayer --features e2e-prompter -p oncl-nmhost
      - run: cargo xtask ext build
      - run: cargo xtask ext-e2e --download
      - name: Keep the driver and daemon logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ext-e2e-logs-${{ github.run_attempt }}
          path: |
            target/ext-e2e/*/driver.log
            target/ext-e2e/*/data/logs/
          if-no-files-found: ignore

  # Windows 7 builds (roadmap D14), blocking: `cargo xtask win7` builds them with the app-local
  # DLLs, fails on an import from its denylist of DLLs and functions missing on Windows 7, then
  # starts them here, where Windows Server 2025 must keep loading its own combase.dll and API sets.
  # Then the installer and the update package of the flavor as the release makes them
  # (`cargo xtask package windows`, flavors win7-x64 and win7-x86), unsigned and not published:
  # the package's contents and Setup.exe through the same gate. The built-in modules are
  # those of `prepare` (`ONCL_BUILTINS_DIR`), as in release.yml.
  win7:
    needs: [changes, fmt, privacy, prepare]
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      VPK_VERSION: 1.3.39-g8d2844f
      BIN: target/win7/${{ matrix.arch }}
      FLAVOR: win7-${{ matrix.arch }}
      ONCL_BUILTINS_DIR: ${{ github.workspace }}/target/builtins
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchains (rust-toolchain.toml for xtask, pinned nightly for Win7)
        shell: bash
        run: |
          rustup toolchain install
          rustup toolchain install nightly-2026-08-12 --profile minimal --component rust-src
          # -Zbuild-std builds the standard library from rust-src, whose files cargo judges
          # by mtime like any path package. rustup dates them at installation, which would
          # make every cached build stale: a fixed date, older than any cache.
          src="$(rustup run nightly-2026-08-12 rustc --print sysroot)/lib/rustlib/src"
          find "$src" -exec touch -d 2026-08-12T00:00:00Z {} +
      - uses: ./.github/actions/pinned-toolchains
        with:
          keep: nightly-2026-08-12
      # Only xtask's own build and the registry, the same for both architectures (x64 saves
      # it): the Windows 7 build has a cache of its own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: win7-xtask
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.arch == 'x64' }}
          cache-on-failure: true
      # The build's own target directory, cached whole and outside `target/`: rust-cache keeps
      # only the packages `cargo metadata` lists, drops the standard library of -Zbuild-std,
      # and then every crate rebuilds. The workspace crates rebuild anyway (a fresh checkout
      # dates their files now), so the key changes only with what the dependencies build from.
      - name: Cache the Windows 7 build
        id: win7-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/win7-target
          key: win7-target-${{ matrix.arch }}-nightly-2026-08-12-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml', 'xtask/src/win7.rs') }}
          restore-keys: win7-target-${{ matrix.arch }}-nightly-2026-08-12-
      - uses: actions/download-artifact@v5
        with:
          name: builtins
          path: target/builtins
      - name: Build, check imports, start
        shell: bash
        run: |
          { echo '## Windows 7 ${{ matrix.arch }}'; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          cargo xtask win7 --arch ${{ matrix.arch }} --target-dir "$RUNNER_TEMP/win7-target" \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # Saved from main only, and only when the key was not an exact hit. Measured on
      # 2026-11-14: one copy of this cache per ref (pull request, branch, tag), 12.8 GB of
      # caches against the repository's 10 GB limit.
      - name: Save the Windows 7 build cache
        if: ${{ github.ref == 'refs/heads/main' && steps.win7-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/win7-target
          key: ${{ steps.win7-cache.outputs.cache-primary-key }}
      - name: Built-in modules embedded
        run: cargo xtask builtins check --bin "${{ env.BIN }}/openncalayer.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: win7-${{ matrix.arch }}
          path: target/win7/${{ matrix.arch }}/
          if-no-files-found: error
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.427
      - name: Install the Velopack CLI
        shell: bash
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/vpk" vpk --version "$VPK_VERSION"
          echo "$RUNNER_TEMP/vpk" >> "$GITHUB_PATH"
      - name: Installer and update package (as release.yml, unsigned)
        shell: bash
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          cargo xtask package windows --flavor "$FLAVOR" --bin "$BIN" --version "$version" \
            --packages packages --dist packaged
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: win7-${{ matrix.arch }}-package
          path: packaged/*
          if-no-files-found: warn
      # A red gate or start keeps what it judged, for `dumpbin`.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: win7-${{ matrix.arch }}-failed-${{ github.run_attempt }}
          path: target/win7/${{ matrix.arch }}/
          if-no-files-found: ignore

  # The Windows 10/11 installers and update packages as the release makes them (release.yml,
  # flavors win-x64 and win-x86, `cargo xtask package windows`), unsigned and not published:
  # the programs and Setup.exe must not need the Visual C++ Redistributable, which a clean
  # Windows does not have (the workspace links the CRT statically, .cargo/config.toml).
  windows-package:
    needs: [changes, fmt, privacy, prepare]
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            flavor: win-x64
          - target: i686-pc-windows-msvc
            flavor: win-x86
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      VPK_VERSION: 1.3.39-g8d2844f
      BIN: target/${{ matrix.target }}/release
      # The built-in modules of `prepare`, embedded as release.yml embeds them.
      ONCL_BUILTINS_DIR: ${{ github.workspace }}/target/builtins
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          key: windows-package-${{ matrix.target }}
      - uses: actions/download-artifact@v5
        with:
          name: builtins
          path: target/builtins
      - name: Build (as release.yml)
        run: cargo build --locked --release --target ${{ matrix.target }} -p openncalayer -p oncl-nmhost
      - name: Built-in modules embedded
        run: cargo xtask builtins check --bin "${{ env.BIN }}/openncalayer.exe"
      - name: Start
        shell: bash
        run: |
          "$BIN/openncalayer.exe" --version
          # The relay exits 1 without its config; a program the loader cannot start exits
          # with STATUS_DLL_NOT_FOUND instead.
          status=0
          "$BIN/nmhost.exe" < /dev/null || status=$?
          test "$status" -eq 1
      - name: Daemon without the test features
        shell: bash
        run: |
          # The release build has no `e2e` subcommand: clap refuses it (exit code 2).
          status=0
          "$BIN/openncalayer.exe" e2e install-plugin x || status=$?
          test "$status" -eq 2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.427
      - name: Install the Velopack CLI
        shell: bash
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/vpk" vpk --version "$VPK_VERSION"
          echo "$RUNNER_TEMP/vpk" >> "$GITHUB_PATH"
      - name: Installer and update package (as release.yml, unsigned)
        shell: bash
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          cargo xtask package windows --flavor ${{ matrix.flavor }} --bin "$BIN" --version "$version" \
            --packages packages --dist packaged
      # The WinGet installer entry as release.yml builds it (without its test harness), with
      # this job's Setup.exe as payload: the import / no-redistributable gate of
      # `cargo xtask package winget-setup`, and its real-process behaviour tests.
      - name: WinGet installer entry (as release.yml, unsigned)
        shell: bash
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          cargo build --locked --release --target ${{ matrix.target }} \
            -p oncl-winget-setup --no-default-features --bin oncl-winget-setup
          cargo xtask package winget-setup --flavor ${{ matrix.flavor }} --version "$version" \
            --entry "$BIN/oncl-winget-setup.exe" \
            --setup "packaged/openncalayer-$version-${{ matrix.flavor }}-setup.exe" --dist winget
      - name: WinGet installer entry tests (real processes)
        if: matrix.flavor == 'win-x64'
        run: cargo test --locked -p oncl-winget-setup --test maintenance

  # The macOS installer and update package as the release makes them (release.yml, flavor
  # osx, `cargo xtask package macos`): both architectures joined by lipo, packed by the pinned
  # vpk, the update package, the .app and the .pkg checked for both slices and for hosts
  # x86_64 and arm64. Unsigned, nothing is published. Full runs only (main, nightly,
  # `full-ci`).
  macos-universal:
    needs: [changes, fmt, privacy, prepare]
    if: needs.changes.outputs.full == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VPK_VERSION: 1.3.39-g8d2844f
      BIN: target/universal-apple-darwin/release
      # The built-in modules of `prepare`, embedded as release.yml embeds them.
      ONCL_BUILTINS_DIR: ${{ github.workspace }}/target/builtins
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: actions/download-artifact@v5
        with:
          name: builtins
          path: target/builtins
      - name: Build both slices and join them
        run: |
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --locked --release --target "$target" -p openncalayer -p oncl-nmhost
          done
          mkdir -p "$BIN"
          for exe in openncalayer nmhost; do
            lipo -create -output "$BIN/$exe" \
              "target/x86_64-apple-darwin/release/$exe" "target/aarch64-apple-darwin/release/$exe"
          done
      - name: Built-in modules embedded
        run: cargo xtask builtins check --bin "$BIN/openncalayer"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.427
      - name: Install the Velopack CLI
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/vpk" vpk --version "$VPK_VERSION"
          echo "$RUNNER_TEMP/vpk" >> "$GITHUB_PATH"
      - name: Installer and update package (as release.yml, unsigned)
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          cargo xtask package macos --bin "$BIN" --version "$version" --packages packages \
            --dist packaged
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: macos-universal-package
          path: packaged/*
          if-no-files-found: warn

  # The Linux AppImage as the release makes it (release.yml, flavor linux-x64): the programs
  # and the AppDir built and started in the pinned glibc 2.28 container, the AppImage packed
  # by the pinned vpk, unpacked, checked against glibc 2.28 and started in the container again.
  # Nothing is published.
  linux-appimage:
    needs: [changes, fmt, privacy, prepare]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VPK_VERSION: 1.3.39-g8d2844f
      ONCL_BUILTINS_DIR: ${{ github.workspace }}/target/builtins
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install squashfs-tools (vpk's AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools
      - uses: actions/download-artifact@v5
        with:
          name: builtins
          path: target/builtins
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.427
      - name: Install the Velopack CLI
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/vpk" vpk --version "$VPK_VERSION"
          echo "$RUNNER_TEMP/vpk" >> "$GITHUB_PATH"
      - name: AppImage and update package (as release.yml)
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          cargo xtask package linux-build --version "$version"
          cargo xtask builtins check --bin target/linux-x64/openncalayer
          cargo xtask package linux --version "$version" --packages packages --dist packaged
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: linux-appimage
          path: packaged/*
          if-no-files-found: warn

  # The required status of the repository's ruleset (it requires a check named `check`). It
  # fails when a job it needs failed or was cancelled, and when a job this run had to run
  # (by the outputs of `changes`) was skipped; a job skipped because the change does not
  # need it passes. A manual run on another ref than main fails it: only main's manual run
  # may stand for the commit. Every job of this file is needed here (xtask's
  # `workflows_ci` test pins that); `live` and `bench` live in scheduled.yml.
  check:
    if: always()
    needs:
      - changes
      - fmt
      - privacy
      - index
      - actionlint
      - deny
      - prepare
      - clippy
      - clippy-windows
      - test-build
      - test
      - test-macos
      - no-markers
      - plugins-release
      - linux-checks
      - builtins-x86
      - tokens-vpcd
      - site
      - extension
      - ext-e2e
      - win7
      - windows-package
      - macos-universal
      - linux-appimage
      - doctests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Results of the needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUST: ${{ needs.changes.outputs.rust }}
          SITE: ${{ needs.changes.outputs.site }}
          APP: ${{ needs.changes.outputs.app }}
          FULL: ${{ needs.changes.outputs.full }}
          MAC_PR: ${{ needs.changes.outputs.mac_pr }}
          RELEASE_PLUGINS: ${{ needs.changes.outputs.release_plugins }}
        run: |
          status=0
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF" != refs/heads/main ]; then
            echo "::error::a manual run on $REF is not a required status; run it on main or open a pull request"
            status=1
          fi
          listed=()
          # expect <job> <true if this run had to run it>
          expect() {
            local job="$1" want="$2" result
            listed+=("$job")
            result="$(jq -r --arg job "$job" '.[$job].result // "missing"' <<< "$NEEDS")"
            case "$result" in
              success) echo "$job: success" ;;
              skipped)
                if [ "$want" = true ]; then
                  echo "::error::$job was skipped, but this run had to run it"
                  status=1
                else
                  echo "$job: skipped (not needed by this run)"
                fi ;;
              *)
                echo "::error::$job: $result"
                status=1 ;;
            esac
          }
          expect changes true
          for job in fmt privacy index actionlint; do expect "$job" true; done
          for job in deny prepare clippy clippy-windows test-build test no-markers linux-checks \
            tokens-vpcd extension ext-e2e; do
            expect "$job" "$RUST"
          done
          expect test-macos "$MAC_PR"
          expect plugins-release "$RELEASE_PLUGINS"
          expect site "$SITE"
          for job in builtins-x86 win7 windows-package linux-appimage; do expect "$job" "$APP"; done
          expect macos-universal "$FULL"
          expect doctests "$FULL"
          # A job added to `needs` without an expectation here fails the check.
          while IFS= read -r job; do
            if ! printf '%s\n' "${listed[@]}" | grep -qxF "$job"; then
              echo "::error::$job is needed by check but has no expectation in this step"
              status=1
            fi
          done < <(jq -r 'keys[]' <<< "$NEEDS")
          exit "$status"
