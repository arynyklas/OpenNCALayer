name: CI

on:
  # `push` only for main: a pull request is checked by its own `pull_request` run, and a
  # branch push next to it ran the whole workflow a second time on the same commit.
  push:
    branches: [main]
  pull_request:
  # Only the `live` job (real NCA services) runs on these two triggers, and `bench` by hand.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the older run of the same pull request. Every other
# run (a push to main, the scheduled and the manual ones) has its own group, the commit: with
# one group per branch GitHub cancels a run that is still waiting behind the running one as
# soon as a newer one is queued (seen on 2026-11-14: the run of a merge commit never started
# and was cancelled one second after the next merge), and a commit on main is left unchecked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # `--all` would also format the local path dependencies, i.e. the vendored crates under
      # `vendor/`. Those are patched copies of upstream crates (provenance: the root NOTICE,
      # and `.omp-upstream.json` / `upstream-provenance.json` where present); they keep
      # upstream formatting so diffs against upstream stay reviewable. Check the workspace
      # members only.
      - name: cargo fmt (workspace members)
        run: |
          packages=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | sed 's/^/-p /' | tr '\n' ' ')
          # shellcheck disable=SC2086
          cargo fmt --check $packages
      - run: cargo fmt --manifest-path crates/oncl-pdk/example/Cargo.toml --check
      # The plugin ports' workspace path-depends on the same vendored crates: members only.
      - name: cargo fmt (plugin ports)
        run: |
          packages=$(cargo metadata --manifest-path plugins/Cargo.toml --no-deps --format-version 1 | jq -r '.packages[].name' | sed 's/^/-p /' | tr '\n' ' ')
          # shellcheck disable=SC2086
          cargo fmt --manifest-path plugins/Cargo.toml --check $packages

  clippy:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev openssl
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Clippy of the example plugin (wasm32)
        run: cargo clippy --locked --manifest-path crates/oncl-pdk/example/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy of the guest SDK (wasm32)
        run: cargo clippy --locked -p oncl-pdk --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy of the built-in modules (wasm32)
        run: cargo clippy --locked -p oncl-builtin-accessory -p oncl-builtin-basics -p oncl-builtin-commonutils -p oncl-builtin-applet --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy of the plugin ports (wasm32)
        run: cargo clippy --locked --manifest-path plugins/Cargo.toml --workspace --target wasm32-unknown-unknown -- -D warnings
      - name: Tests of the ports' shared libraries
        run: cargo test --locked --manifest-path plugins/Cargo.toml -p oncl-port-kit -p oncl-port-pki

  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    # Three shards per OS. One job ran every test binary (`--no-fail-fast`) one after the
    # other: 59, 66 and 75 minutes in the run of 2026-11-14, 37 to 42 of them executing tests.
    # The packages are split by measured run time (about 17 minutes each):
    #   a: the built-in modules' tests (and their second pass without markers), their build,
    #      the API, the PKI crate;
    #   b: XML, xtask, the server, the protocol crate, plus the checks of this job (the first
    #      run measured b at 33 minutes on Linux with the second pass, a at 15);
    #   c: every other package of the workspace (`--exclude` of the two lists, so a new package
    #      lands here and nothing is dropped). The UI parity tests run the `oncl` binary that
    #      this very `cargo test` builds, so oncl-ui and oncl-cli stay together, in c; the
    #      daemon's `maintenance_e2e` (Windows) runs `oncl-winget-harness`, built by
    #      oncl-winget-setup, so the daemon and that crate stay together, in c as well.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        shard: [a, b, c]
    name: test (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Line tables keep file:line in backtraces; full debug info makes linking the test
      # binaries (above all on Windows) and the cache much slower.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev openssl
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      # One cache per OS for the three shards (`shared-key`); only shard b saves it: its
      # dependency closure contains the others' (a is 4 GB, b 9, c 10 of the 19 GB build), and
      # three saves of the same key would race and store whichever shard finished first.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 'b' }}
          cache-on-failure: true
      # Every platform's packages: the licences tests (`committed_licenses_are_fresh`,
      # `committed_plugin_licenses_are_fresh`) and the SDK's inventory test
      # (`committed_inventory_is_current_and_a_stale_copy_is_detected`, `cargo tree --target`
      # of every platform) read them offline. Their result does not depend on the host, so
      # they run on Linux alone, where the fetch takes seconds (close to a minute on Windows).
      - name: Fetch packages
        if: runner.os == 'Linux' && matrix.shard == 'b'
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path plugins/Cargo.toml
      # The oracles of the tests that compare the workspace with tools that do not share its
      # code. Those tests FAIL without them (nothing is skipped): pyHanko, lxml, cryptography
      # and asn1crypto from xtask/assets/oracle/requirements.txt in a virtualenv, and an OpenSSL
      # 3 that has `cms` and `pkcs12 -legacy` (the Linux and Git for Windows ones; macOS ships
      # LibreSSL, so Homebrew's).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Oracle environment (pyHanko 0.38.0, OpenSSL)
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/oracle"
          if [ "$RUNNER_OS" = Windows ]; then
            py="$RUNNER_TEMP/oracle/Scripts/python.exe"
          else
            py="$RUNNER_TEMP/oracle/bin/python"
          fi
          "$py" -m pip install --require-virtualenv -r xtask/assets/oracle/requirements.txt
          "$py" -c "import pyhanko, lxml, cryptography, asn1crypto, gostcrypto"
          echo "ONCL_PYHANKO_PYTHON=$py" >> "$GITHUB_ENV"
          # Linux: openssl from apt (on PATH). Windows: the tests find Git for Windows'
          # openssl.exe under ProgramFiles themselves (docs/user/cli.md), nothing to export.
          if [ "$RUNNER_OS" = macOS ]; then
            brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
            echo "ONCL_OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"
          fi
      - name: Test
        shell: bash
        run: |
          skip=()
          if [ "$RUNNER_OS" != Linux ]; then
            skip=(--skip committed_licenses_are_fresh --skip committed_plugin_licenses_are_fresh
              --skip committed_inventory_is_current_and_a_stale_copy_is_detected)
          fi
          # The packages of the shards (see `strategy` above).
          shard_a=(-p oncl-builtin-tests -p oncl-builtins-build -p oncl-api -p oncl-pki)
          shard_b=(-p oncl-xml -p xtask -p oncl-server -p oncl-protocol)
          case "${{ matrix.shard }}" in
            a) scope=("${shard_a[@]}") ;;
            b) scope=("${shard_b[@]}") ;;
            c) scope=(--workspace)
               for p in oncl-builtin-tests oncl-builtins-build oncl-api oncl-pki oncl-xml xtask oncl-server oncl-protocol; do scope+=(--exclude "$p"); done ;;
          esac
          cargo xtask fetch-fixtures
          # The built-in modules' benchmarks (`bench_*`) run in release, in the `bench` job.
          # Ignored tests this job does not run: the two that write more than 4 GiB of real
          # bytes (run by hand, release probes), and four developer tools that need their own
          # input or program (`ONCL_DENSE_PDF`, `LOOPBACK_PKI_DIR`, `ONCL_SMOKE_DIR`, `winget`
          # on PATH). Every other ignored test runs here, fixtures and oracles included: the
          # parity tests of oncl-ui run the `oncl` binary that this very `cargo test` builds
          # (target/debug/oncl). A missing oracle fails them.
          cargo test "${scope[@]}" --all-features --no-fail-fast -- --include-ignored --skip live_ --skip zola_ --skip bench_ \
            --skip offset_over_4gib --skip common_region_replay_crosses_four_gib \
            --skip external_dense_pdf_signs_and_verifies --skip serve_a_synthetic_authority_until_stdin_closes \
            --skip smoke_data_dir --skip real_winget_validates_the_emitted_manifests \
            "${skip[@]}"
      # The built-in modules' tests again with no markers for the long strings of a request
      # (the modules read them as the tests sent them): the same tests pass both ways. The
      # modules run in the same interpreter on every OS, so this second pass (11 minutes) runs
      # on Linux only.
      - name: Built-in modules without markers
        if: runner.os == 'Linux' && matrix.shard == 'a'
        shell: bash
        run: ONCL_TEST_NO_MARKERS=1 cargo test -p oncl-builtin-tests -- --skip bench_
      # The daemon as releases build it (no `e2e-prompter`, no `token-emulator`): the token
      # emulator's variable changes nothing.
      - name: Daemon without the test features
        if: runner.os == 'Linux' && matrix.shard == 'b'
        run: cargo test -p openncalayer --lib release_build_ignores_emulator_var
      # The app-local DLLs of the Windows 7 builds are workspace members; on Windows their
      # tests build them.
      - name: Build the Windows 7 app-local DLLs
        if: runner.os != 'Windows' && matrix.shard == 'a'
        run: cargo build -p oncl-win7shim-combase -p oncl-win7shim-winrt-error
      - name: CMS interop with OpenSSL
        if: runner.os == 'Linux' && matrix.shard == 'b'
        run: cargo xtask interop-openssl
      # Offline and read-only (about 3 s): the SDK's dependency closure against the forbidden
      # crates. `cargo xtask sdk smoke` (packs and builds the chain, about 75 s warm) stays a
      # manual gate: its offline consumer resolve was not tried against a cold CI cache.
      # Offline and read-only: `cargo tree -p <program> -e normal -f "{p} [{f}]"` of the four
      # release programs (openncalayer, oncl-cli, oncl-server, oncl-ui) must show the `testing`
      # feature on no crate. Releases build with `-p`, but `cargo build --workspace
      # --all-targets` and `cargo test` unify the dev-dependencies' `testing` into the same
      # binaries; this fails if it ever reaches the normal tree (`for_tests` constructors forge
      # key-use approvals).
      - name: No testing feature in release programs
        if: runner.os == 'Linux' && matrix.shard == 'b'
        run: cargo xtask check-release-features
      - name: SDK dependency closure
        if: runner.os == 'Linux' && matrix.shard == 'b'
        run: cargo xtask sdk closure
      # Offline and read-only (under 1 s warm): the lint of the `[[operations]]` of every
      # `plugins/*/plugin.toml` against the modules the Test step above built (the port tests
      # of oncl-port-tests and `plugin_ports_manual` build `plugins/` into target/plugin-ports);
      # a missing module is an error. The same ports run under the manual window's call path in
      # `plugin_ports_manual` (docs/dev/plugins-manual-tests.md): its `#[ignore]`d tests are
      # among those `--include-ignored` runs in the Test step, so nothing there is skipped.
      - name: Plugin operations lint
        if: runner.os == 'Linux' && matrix.shard == 'c'
        run: cargo xtask plugin-ops-check --require-wasm --wasm-dir target/plugin-ports/wasm32-unknown-unknown/release
      # The tags are needed: it compares the ports with the last `plugins-*` tag
      # (docs/dev/plugin-version-check.md); without one it only prints a NOTICE.
      - name: Plugin versions bumped
        if: runner.os == 'Linux' && matrix.shard == 'b'
        run: cargo xtask plugin-version-check

  # The `clippy` job runs on Linux and never sees `cfg(windows)` code (oncl-ui foreground):
  # this one lints it next to the test shards instead of after them (6 minutes).
  clippy-windows:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # The built-in modules' limits in a 32-bit process, where their memory is smallest.
  builtins-x86:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add i686-pc-windows-msvc
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Limits
        run: cargo test --locked --target i686-pc-windows-msvc -p oncl-builtin-tests --test limits

  # The real PC/SC backend (libpcsclite opened at run time) against an emulated Kaztoken:
  # pcscd with vsmartcard's virtual reader (a CI tool only: not linked, not shipped), the
  # card served by `cargo xtask token-emu`.
  tokens-vpcd:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install pcscd and vpcd
        run: |
          sudo apt-get update
          if ! sudo apt-get install -y pcscd vsmartcard-vpcd; then
            echo "::error::pcscd or vsmartcard-vpcd is not installable on this runner image"
            exit 1
          fi
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Build
        run: |
          cargo build -p xtask
          cargo test --no-run -p oncl-token --features emulator --test vpcd
      - name: Test against the emulated Kaztoken
        run: |
          # The packaged pcscd is socket-activated and exits when idle (--auto-exit): stop
          # it and run one for the whole step (the polkit check is for desktop sessions),
          # then serve the card to its vpcd reader. The tests wait for the card to appear;
          # one at a time, as they share the card.
          sudo systemctl stop pcscd.socket pcscd.service 2>/dev/null || true
          # The log belongs to the runner user, not root: the redirect is meant.
          # shellcheck disable=SC2024
          sudo pcscd --foreground --disable-polkit > pcscd.log 2>&1 &
          cargo xtask token-emu --config crates/oncl-token/tests/vpcd-kaztoken.toml \
            > token-emu.log 2>&1 &
          status=0
          ONCL_TOKEN_VPCD=1 cargo test -p oncl-token --features emulator --test vpcd \
            -- --test-threads=1 || status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- pcscd"; cat pcscd.log
            echo "--- token-emu"; cat token-emu.log
          fi
          exit "$status"

  deny:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      # The plugin ports' own lock file, under the core's rules.
      - name: cargo deny of the plugin ports
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: plugins/Cargo.toml
          arguments: --all-features --config deny.toml

  # The project site (`site/`): built with the pinned Zola from the committed ports and the
  # fixtures, and checked offline. Publishing is `pages.yml`'s.
  site:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # The `zola_` tests (ignored, they download Zola) run here, not in `test`.
      - run: cargo xtask registry build
      - run: cargo test -p xtask --test registry_site -- --ignored zola_

  extension:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Only whether the AMO secrets exist: the secrets themselves reach the signing step alone.
      AMO_SIGNING: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # A glob, not the directory: since Node 21 `--test` arguments are patterns.
      - run: node --test "extension/test/*.test.mjs"
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo xtask ext build
      # Unlisted AMO signing (roadmap D6). Skipped without the secrets; release tags (`v*`)
      # only, because AMO refuses a version it has already signed.
      - name: Sign the Firefox add-on (AMO, unlisted)
        if: env.AMO_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: >-
          npx --yes web-ext@10.8.0 sign --channel unlisted
          --source-dir target/extension/firefox --artifacts-dir target/extension/signed
      - name: Keep the signed add-on
        if: env.AMO_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: openncalayer-firefox-signed
          path: target/extension/signed/*.xpi
          if-no-files-found: error

  # The extension in Chrome for Testing, Firefox and Firefox ESR 115, over native messaging to
  # the daemon.
  ext-e2e:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # libdbus-glib-1-2: Firefox ESR 115 links libdbus-glib-1.so.2 (later Firefox does not).
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev openssl libdbus-glib-1-2
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo build --release -p openncalayer --features e2e-prompter -p oncl-nmhost
      - run: cargo xtask ext build
      - run: cargo xtask ext-e2e --download
      - name: Keep the driver and daemon logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ext-e2e-logs-${{ github.run_attempt }}
          path: |
            target/ext-e2e/*/driver.log
            target/ext-e2e/*/data/logs/
          if-no-files-found: ignore

  # Windows 7 builds (roadmap D14), blocking: `cargo xtask win7` builds them with the app-local
  # DLLs, fails on an import from its denylist of DLLs and functions missing on Windows 7, then
  # starts them here, where Windows Server 2025 must keep loading its own combase.dll and API sets.
  # Then the installer and the update package of the flavor as the release makes them
  # (`cargo xtask package windows`, flavors win7-x64 and win7-x86), unsigned and not published:
  # the package's contents and Setup.exe through the same gate.
  win7:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      VPK_VERSION: 1.3.39-g8d2844f
      BIN: target/win7/${{ matrix.arch }}
      FLAVOR: win7-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchains (rust-toolchain.toml for xtask, pinned nightly for Win7)
        shell: bash
        run: |
          rustup toolchain install
          rustup toolchain install nightly-2026-08-12 --profile minimal --component rust-src
          # -Zbuild-std builds the standard library from rust-src, whose files cargo judges
          # by mtime like any path package. rustup dates them at installation, which would
          # make every cached build stale: a fixed date, older than any cache.
          src="$(rustup run nightly-2026-08-12 rustc --print sysroot)/lib/rustlib/src"
          find "$src" -exec touch -d 2026-08-12T00:00:00Z {} +
      - uses: ./.github/actions/pinned-toolchains
        with:
          keep: nightly-2026-08-12
      # Only xtask's own build and the registry: the Windows 7 build has a cache of its own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          key: win7-${{ matrix.arch }}-xtask
      # The build's own target directory, cached whole and outside `target/`: rust-cache keeps
      # only the packages `cargo metadata` lists, drops the standard library of -Zbuild-std,
      # and then every crate rebuilds. The workspace crates rebuild anyway (a fresh checkout
      # dates their files now), so the key changes only with what the dependencies build from.
      - name: Cache the Windows 7 build
        id: win7-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/win7-target
          key: win7-target-${{ matrix.arch }}-nightly-2026-08-12-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'vendor/*/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml', 'xtask/src/win7.rs') }}
          restore-keys: win7-target-${{ matrix.arch }}-nightly-2026-08-12-
      - name: Build, check imports, start
        shell: bash
        run: |
          { echo '## Windows 7 ${{ matrix.arch }}'; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          cargo xtask win7 --arch ${{ matrix.arch }} --target-dir "$RUNNER_TEMP/win7-target" \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # Saved from main only, and only when the key was not an exact hit. Measured on
      # 2026-11-14: one copy of this cache per ref (pull request, branch, tag), 12.8 GB of
      # caches against the repository's 10 GB limit.
      - name: Save the Windows 7 build cache
        if: ${{ github.ref == 'refs/heads/main' && steps.win7-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/win7-target
          key: ${{ steps.win7-cache.outputs.cache-primary-key }}
      - name: Built-in modules embedded
        run: cargo xtask builtins check --bin "${{ env.BIN }}/openncalayer.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: win7-${{ matrix.arch }}
          path: target/win7/${{ matrix.arch }}/
          if-no-files-found: error
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.427
      - name: Install the Velopack CLI
        shell: bash
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/vpk" vpk --version "$VPK_VERSION"
          echo "$RUNNER_TEMP/vpk" >> "$GITHUB_PATH"
      - name: Installer and update package (as release.yml, unsigned)
        shell: bash
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          cargo xtask package windows --flavor "$FLAVOR" --bin "$BIN" --version "$version" \
            --packages packages --dist packaged
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: win7-${{ matrix.arch }}-package
          path: packaged/*
          if-no-files-found: warn
      # A red gate or start keeps what it judged, for `dumpbin`.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: win7-${{ matrix.arch }}-failed-${{ github.run_attempt }}
          path: target/win7/${{ matrix.arch }}/
          if-no-files-found: ignore

  # The Windows 10/11 installers and update packages as the release makes them (release.yml,
  # flavors win-x64 and win-x86, `cargo xtask package windows`), unsigned and not published:
  # the programs and Setup.exe must not need the Visual C++ Redistributable, which a clean
  # Windows does not have (the workspace links the CRT statically, .cargo/config.toml).
  windows-package:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            flavor: win-x64
          - target: i686-pc-windows-msvc
            flavor: win-x86
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      VPK_VERSION: 1.3.39-g8d2844f
      BIN: target/${{ matrix.target }}/release
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          key: windows-package-${{ matrix.target }}
      # Built once and embedded as release.yml does (`ONCL_BUILTINS_DIR`).
      - name: Built-in modules (as release.yml)
        run: cargo xtask builtins build
      - name: Build (as release.yml)
        env:
          ONCL_BUILTINS_DIR: ${{ github.workspace }}/target/builtins
        run: cargo build --locked --release --target ${{ matrix.target }} -p openncalayer -p oncl-nmhost
      - name: Built-in modules embedded
        run: cargo xtask builtins check --bin "${{ env.BIN }}/openncalayer.exe"
      - name: Start
        shell: bash
        run: |
          "$BIN/openncalayer.exe" --version
          # The relay exits 1 without its config; a program the loader cannot start exits
          # with STATUS_DLL_NOT_FOUND instead.
          status=0
          "$BIN/nmhost.exe" < /dev/null || status=$?
          test "$status" -eq 1
      - name: Daemon without the test features
        shell: bash
        run: |
          # The release build has no `e2e` subcommand: clap refuses it (exit code 2).
          status=0
          "$BIN/openncalayer.exe" e2e install-plugin x || status=$?
          test "$status" -eq 2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.427
      - name: Install the Velopack CLI
        shell: bash
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/vpk" vpk --version "$VPK_VERSION"
          echo "$RUNNER_TEMP/vpk" >> "$GITHUB_PATH"
      - name: Installer and update package (as release.yml, unsigned)
        shell: bash
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          cargo xtask package windows --flavor ${{ matrix.flavor }} --bin "$BIN" --version "$version" \
            --packages packages --dist packaged
      # The WinGet installer entry as release.yml builds it (without its test harness), with
      # this job's Setup.exe as payload: the import / no-redistributable gate of
      # `cargo xtask package winget-setup`, and its real-process behaviour tests.
      - name: WinGet installer entry (as release.yml, unsigned)
        shell: bash
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          cargo build --locked --release --target ${{ matrix.target }} \
            -p oncl-winget-setup --no-default-features --bin oncl-winget-setup
          cargo xtask package winget-setup --flavor ${{ matrix.flavor }} --version "$version" \
            --entry "$BIN/oncl-winget-setup.exe" \
            --setup "packaged/openncalayer-$version-${{ matrix.flavor }}-setup.exe" --dist winget
      - name: WinGet installer entry tests (real processes)
        if: matrix.flavor == 'win-x64'
        run: cargo test --locked -p oncl-winget-setup --test maintenance

  # The macOS installer and update package as the release makes them (release.yml, flavor
  # osx, `cargo xtask package macos`): both architectures joined by lipo, packed by the pinned
  # vpk, the update package, the .app and the .pkg checked for both slices and for hosts
  # x86_64 and arm64. Unsigned, nothing is published.
  macos-universal:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VPK_VERSION: 1.3.39-g8d2844f
      BIN: target/universal-apple-darwin/release
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Built-in modules (as release.yml)
        run: cargo xtask builtins build
      - name: Build both slices and join them
        env:
          ONCL_BUILTINS_DIR: ${{ github.workspace }}/target/builtins
        run: |
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --locked --release --target "$target" -p openncalayer -p oncl-nmhost
          done
          mkdir -p "$BIN"
          for exe in openncalayer nmhost; do
            lipo -create -output "$BIN/$exe" \
              "target/x86_64-apple-darwin/release/$exe" "target/aarch64-apple-darwin/release/$exe"
          done
      - name: Built-in modules embedded
        run: cargo xtask builtins check --bin "$BIN/openncalayer"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.427
      - name: Install the Velopack CLI
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/vpk" vpk --version "$VPK_VERSION"
          echo "$RUNNER_TEMP/vpk" >> "$GITHUB_PATH"
      - name: Installer and update package (as release.yml, unsigned)
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          cargo xtask package macos --bin "$BIN" --version "$version" --packages packages \
            --dist packaged
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: macos-universal-package
          path: packaged/*
          if-no-files-found: warn

  # The Linux AppImage as the release makes it (release.yml, flavor linux-x64): the programs
  # and the AppDir built and started in the pinned glibc 2.28 container, the AppImage packed
  # by the pinned vpk, unpacked, checked against glibc 2.28 and started in the container again.
  # Nothing is published.
  linux-appimage:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VPK_VERSION: 1.3.39-g8d2844f
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install squashfs-tools (vpk's AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.427
      - name: Install the Velopack CLI
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/vpk" vpk --version "$VPK_VERSION"
          echo "$RUNNER_TEMP/vpk" >> "$GITHUB_PATH"
      - name: AppImage and update package (as release.yml)
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          cargo xtask package linux-build --version "$version"
          cargo xtask builtins check --bin target/linux-x64/openncalayer
          cargo xtask package linux --version "$version" --packages packages --dist packaged
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: linux-appimage
          path: packaged/*
          if-no-files-found: warn

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev openssl
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Fetch fixtures
        run: cargo xtask fetch-fixtures
      - name: Live tests
        run: cargo test --workspace --all-features -- --ignored live_
      # Docker comes with the runner image. Runs even if a live test failed: it does not
      # depend on them.
      - name: NCANode interop (XMLDSig, CMS)
        if: ${{ !cancelled() }}
        run: cargo xtask interop-ncanode

  # The built-in modules' benchmarks and their thresholds (`bench_*`), in release, on the
  # runner the thresholds are set for. By hand: they need a quiet machine.
  bench:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/pinned-toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Fetch fixtures
        run: cargo xtask fetch-fixtures
      - name: Benchmarks
        run: cargo test --locked --release -p oncl-builtin-tests --test bench -- --ignored --test-threads=1
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: builtins-bench
          path: target/builtins-bench.json
          if-no-files-found: warn

  actionlint:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # shellcheck comes with the runner image; actionlint runs it over the `run:` scripts.
      - name: actionlint
        run: |
          curl -sSfLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color .github/workflows/*.yml
