name: Index check

# `cargo xtask index check` (format, signature by the current key, validity, asset URLs on
# the project's releases answering HEAD with 200, `seq` growth against the base, the update
# key in the tag of every new version, the `vm-smoke` commit status on the tag of every new
# version and the `conformance` status on the tag of every new stable version) when a pull
# request or a push to `main` changes the update indexes or the update keys, and
# `cargo xtask tuf check --no-timestamp` (the TUF repository `tuf/v1` verified with the
# client's code from the trust anchor, its targets equal to the indexes, history unchanged
# against the base) when it changes `tuf/` or the anchor too. Without `tuf/` and the anchor
# (before the owner's ceremony) that check says so and passes. It runs on
# every pull request and push to `main` and decides in the job whether those changed, so
# the check always reports and can be a required status check: with nothing relevant
# changed, only the cargo step is skipped and the check passes.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # The commit statuses of release tags (`vm-smoke`, `conformance`), read through the API.
  statuses: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The base too: `seq` is compared against its indexes. The tags: every new
          # version's tag must hold a trusted update key.
          fetch-depth: 0
      - name: What changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # --no-renames: a file moved out of updates/ or the keys counts as changed there.
          if [ "$EVENT" = pull_request ]; then
            base="origin/$BASE_REF"
            changed="$(git diff --name-only --no-renames "$base...HEAD")"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            base="$BEFORE"
            changed="$(git diff --name-only --no-renames "$base" HEAD)"
          elif [ -e updates ] || [ -e crates/oncl-update/keys ] || [ -e tuf ]; then
            # A new branch or a history this clone does not have: check without a base.
            base=""
            changed="updates/"
          else
            # No base and neither indexes nor keys in the tree (before the maintainer's
            # keys exist): there is nothing to check.
            base=""
            changed=""
          fi
          if printf '%s\n' "$changed" | grep -qE '^(updates/|tuf/|crates/oncl-update/keys/)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "nothing under updates/, tuf/ or crates/oncl-update/keys/ changed: no index to check"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Install toolchain (rust-toolchain.toml)
        if: steps.changes.outputs.relevant == 'true'
        run: rustup toolchain install
      # With no `updates/v1` yet (keys committed before the first index), only the keys are
      # read (and built into `oncl-update`, which fails on a malformed one).
      - name: Check the indexes
        if: steps.changes.outputs.relevant == 'true'
        env:
          BASE: ${{ steps.changes.outputs.base }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$BASE" ]; then
            cargo xtask index check updates/v1 --base "$BASE" --vm-smoke --conformance
          else
            cargo xtask index check updates/v1 --no-base --vm-smoke --conformance
          fi
      # The repository of the update indexes' TUF metadata: errors fail the check, an expiring
      # or expired file is a warning here (the weekly `tuf-expiry` workflow and the daily
      # Pages run are the ones that go red for it). With no `tuf/v1` and no anchor it passes.
      - name: Check the TUF repository
        if: steps.changes.outputs.relevant == 'true'
        env:
          BASE: ${{ steps.changes.outputs.base }}
        run: |
          if [ -n "$BASE" ]; then
            cargo xtask tuf check --no-timestamp --base "$BASE"
          else
            cargo xtask tuf check --no-timestamp
          fi
