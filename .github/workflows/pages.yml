name: Pages

# GitHub Pages of the project, one artifact: the project site (`site/`, built by
# `cargo xtask registry build` with the pinned Zola) and beside it the update indexes
# `updates/`, copied byte for byte under `/updates/` (`/updates/v1/<channel>.json`).
#
# Runs on a push to main that changes the site's inputs, daily (the releases and the
# `upstream` branch's facts change without a push), after the upstream watcher publishes
# facts (`repository_dispatch`), after each run of the Release workflow (`workflow_run`:
# its `publish` job creates the release with GITHUB_TOKEN, and events of GITHUB_TOKEN start
# no workflow, so `release` never fires for it), when the maintainer publishes, edits or
# deletes a release (`release`), and by hand. `workflow_run` runs on the default branch; a
# `release` event runs on the release's tag, which the `github-pages` environment does not
# deploy: it only starts this workflow again on the default branch.
#
# Pages must be enabled with "GitHub Actions" as the source in the repository settings;
# until then the site is built and checked, and nothing is deployed.
#
# TUF (`docs/design/tuf.md`, `docs/dev/release.md`): if `tuf/v1` exists, it is published
# under `/tuf/v1/` beside the indexes, with a `metadata/timestamp.json` made on every run.
# The timestamp is the only thing CI signs, and its key is the one secret CI has:
# `TUF_TIMESTAMP_KEY`, a secret of the environment `tuf-timestamp` (deployment branches:
# `main` only), read by the one step of the `timestamp` job that signs. That job runs only in
# this repository, only on `main`, only on events that the maintainers (or the schedule)
# start, never on a pull request; it has no write permission, every action in it is pinned by
# commit, and its last step is the one with the secret. It hands the signed file, which is
# not secret, to `build` as a job output, so no action runs after the secret is in the
# environment, and `build` (which assembles the site from this repository's files) never
# sees the key. Once `tuf/v1` exists, a missing secret, a repository the client would refuse
# or a snapshot that has expired fails the run and nothing is deployed: the site that is
# served keeps its timestamp (valid for 7 days) rather than lose it. `oracle` checks the
# assembled repository with python-tuf before `deploy`; `verify` runs the real client against
# the deployed site. `xtask/tests/workflows_tuf.rs` pins these rules.
on:
  push:
    branches: [main]
    paths:
      - "updates/**"
      - "crates/oncl-update/keys/**"
      - "tuf/**"
      - "site/**"
      - "plugins/*/plugin.toml"
      - "plugins/*/registry.toml"
      - "xtask/**"
      - "crates/oncl-flows/src/capabilities.rs"
      - "crates/oncl-builtin-accessory/**"
      - "fixtures/registry/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "41 4 * * *"
  repository_dispatch:
    types: [upstream]
  workflow_run:
    workflows: [Release]
    types: [completed]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The timestamp of the TUF repository, signed with the online key (see the header). It
  # does nothing without `tuf/v1`. With it, a missing secret, a repository the client would
  # refuse or a snapshot that has expired fails the job: the run is red, and `build` and
  # `deploy` do not run.
  timestamp:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'arynyklas/OpenNCALayer' && (
      github.event_name == 'push' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: tuf-timestamp
    permissions:
      contents: read
    outputs:
      file: ${{ steps.sign.outputs.file }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Is there a TUF repository?
        id: tree
        run: |
          if [ -d tuf/v1 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no tuf/v1 yet: no timestamp to sign"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install toolchain (rust-toolchain.toml)
        if: steps.tree.outputs.exists == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.tree.outputs.exists == 'true'
        with:
          shared-key: tuf-timestamp
      # Compiled here, before the secret is in any environment: the build scripts and
      # dependencies never run with the key.
      - name: Build xtask
        if: steps.tree.outputs.exists == 'true'
        run: cargo build -p xtask
      # The last step. `xtask tuf timestamp` verifies the repository from the committed
      # anchor first, with the client's code (the chain of roots, signatures, versions,
      # hashes of every file, the targets against `updates/v1`, a day of validity left),
      # and signs only if it holds.
      - name: Sign the timestamp
        id: sign
        if: steps.tree.outputs.exists == 'true'
        env:
          TUF_TIMESTAMP_KEY: ${{ secrets.TUF_TIMESTAMP_KEY }}
        run: |
          if [ -z "$TUF_TIMESTAMP_KEY" ]; then
            echo "::error::tuf/v1 exists, but the secret TUF_TIMESTAMP_KEY is not set in the environment tuf-timestamp: no timestamp can be signed (docs/dev/release.md, section 7g)"
            exit 1
          fi
          echo "::add-mask::$TUF_TIMESTAMP_KEY"
          copy="$RUNNER_TEMP/tuf"
          cp -R tuf/v1 "$copy"
          target/debug/xtask tuf timestamp --out "$copy"
          {
            echo "file<<TUF_TIMESTAMP_EOF"
            cat "$copy/metadata/timestamp.json"
            echo "TUF_TIMESTAMP_EOF"
          } >> "$GITHUB_OUTPUT"

  dispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run Pages on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"

  build:
    needs: timestamp
    # Not when the timestamp job failed: a site without `metadata/timestamp.json` would make
    # every client's check fail (a 404 is an error), while the site now served still has one.
    # It runs when that job was skipped (a fork, an event or a ref it does not sign on).
    if: ${{ !cancelled() && needs.timestamp.result != 'failure' && github.event_name != 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
      deployments: read
    outputs:
      publish: ${{ steps.pages.outputs.publish }}
      tuf: ${{ steps.tuf.outputs.state }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The base the indexes are compared with and the release tags (every new
          # version's tag must hold a trusted update key).
          fetch-depth: 0
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: pages
      # Nothing unsigned, expired or pointing elsewhere is published, even if pushed past the
      # pull request check. Changed content needs a greater `seq` than the base: on a push the
      # commit before it; otherwise the commit Pages serves now (the newest successful
      # deployment of `github-pages`), so no run publishes anything a push would have
      # refused. Without a deployment yet, the check runs without a base. A tree without
      # `updates/v1` is published only if neither the base nor the deployed commit has it:
      # removing the indexes would leave the installed clients without updates.
      - name: Check the indexes
        id: indexes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          deployed=""
          deployments=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=30" \
            --jq '.[] | "\(.id) \(.sha)"')
          while read -r id sha; do
            [ -n "$id" ] || continue
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq '.[0].state')
            if [ "$state" = success ]; then
              deployed="$sha"
              break
            fi
          done <<< "$deployments"
          base="$deployed"
          if [ "$EVENT" = push ]; then
            base=""
            if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
              base="$BEFORE"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          for commit in "$base" "$deployed"; do
            if [ -n "$commit" ]; then
              git cat-file -e "$commit^{commit}"
            fi
          done
          if [ ! -d updates/v1 ]; then
            for commit in "$base" "$deployed"; do
              if [ -n "$commit" ]; then
                if git cat-file -e "$commit:updates/v1" 2> /dev/null; then
                  echo "::error::updates/v1 is gone, but $commit has it: the indexes would be unpublished"
                  exit 1
                fi
              fi
            done
            echo "::notice::no updates/v1 yet: no indexes to check"
            exit 0
          fi
          if [ -n "$base" ]; then
            cargo xtask index check updates/v1 --base "$base"
          else
            cargo xtask index check updates/v1 --no-base
          fi
      # The committed TUF tree, always, as the indexes above: a trust anchor without `tuf/v1`
      # (or the other way round) fails; with neither (before the owner's ceremony) it passes.
      - name: Check the TUF repository
        env:
          BASE: ${{ steps.indexes.outputs.base }}
        run: |
          args=(--no-timestamp)
          if [ -n "$BASE" ]; then
            args+=(--base "$BASE")
          fi
          cargo xtask tuf check "${args[@]}"
      - name: Is Pages enabled?
        id: pages
        run: |
          if build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2> pages.err); then
            if [ "$build_type" != workflow ]; then
              echo "::error::Pages builds from $build_type, not GitHub Actions"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" pages.err; then
            echo "::notice::Pages is not enabled: the site is built and checked, not deployed"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            cat pages.err
            exit 1
          fi
      - name: Releases
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          if ! gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | {tag_name, draft, prerelease, published_at, assets: [.assets[] | {name}]}' \
            > "$RUNNER_TEMP/site/releases.jsonl"; then
            echo "::warning::the list of releases could not be read: the site shows none"
            rm -f "$RUNNER_TEMP/site/releases.jsonl"
          fi
      - name: The upstream branch
        run: |
          dir="$RUNNER_TEMP/site/upstream"
          status=0
          git ls-remote --exit-code origin refs/heads/upstream > /dev/null || status=$?
          if [ "$status" = 2 ]; then
            echo "::notice::no upstream branch yet"
            exit 0
          elif [ "$status" != 0 ]; then
            echo "::warning::the upstream branch could not be listed: the site shows no facts"
            exit 0
          fi
          if ! git fetch --no-tags --depth 1 origin refs/heads/upstream; then
            echo "::warning::the upstream branch could not be fetched: the site shows no facts"
            exit 0
          fi
          mkdir -p "$dir/latest"
          git show FETCH_HEAD:index.json > "$dir/index.json" || rm -f "$dir/index.json"
          git show FETCH_HEAD:latest/facts.json > "$dir/latest/facts.json" || rm -f "$dir/latest/facts.json"
      - name: Build the site
        run: |
          args=(--out target/site)
          if [ -f "$RUNNER_TEMP/site/releases.jsonl" ]; then
            args+=(--releases "$RUNNER_TEMP/site/releases.jsonl")
          fi
          if [ -d "$RUNNER_TEMP/site/upstream" ]; then
            args+=(--upstream "$RUNNER_TEMP/site/upstream")
          fi
          cargo xtask registry build "${args[@]}"
      # The site has no `updates/` of its own: the indexes are copied as they are committed.
      - name: Assemble the artifact
        run: |
          mv target/site/public _site
          test ! -e _site/updates
          if [ -d updates ]; then
            cp -R updates _site/updates
            diff -r updates _site/updates
          fi
          cargo xtask registry check _site
      # The TUF repository, from a copy: the committed tree gets no timestamp. The copy with
      # the signed timestamp of the `timestamp` job is verified as the client would read it,
      # and the run is red when targets or snapshot are about to expire (the owner's monthly
      # `cargo xtask tuf update --refresh`).
      - name: Publish the TUF repository
        id: tuf
        env:
          TIMESTAMP: ${{ needs.timestamp.outputs.file }}
        run: |
          if [ ! -d tuf/v1 ]; then
            echo "state=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test ! -e _site/tuf
          mkdir -p _site/tuf
          cp -R tuf/v1 _site/tuf/v1
          if [ -z "$TIMESTAMP" ]; then
            if [ "$GITHUB_REPOSITORY" = arynyklas/OpenNCALayer ]; then
              echo "::error::tuf/v1 exists and no timestamp was signed (the timestamp job did not run on this event or ref): nothing is published without it"
              exit 1
            fi
            echo "::warning::a fork: the TUF repository is published without a timestamp"
            echo "state=unsigned" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$TIMESTAMP" > _site/tuf/v1/metadata/timestamp.json
          # Three days (root too): closer than that the timestamp job refuses (a day), and
          # the weekly tuf-expiry workflow, which warns at 10 and 45, has long been red.
          cargo xtask tuf check --dir _site/tuf/v1 --fail-on-expiring --min-days 3 --min-root-days 3
          echo "state=signed" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.publish == 'true'
        with:
          path: _site

  # python-tuf, an independent implementation, reads the assembled repository exactly as it
  # will be served: from the artifact. Its acceptance is necessary, not sufficient (it accepts
  # things the Rust client refuses; `cargo xtask tuf check` is the contract). No secret, no
  # write permission, dependencies pinned by hash.
  oracle:
    needs: build
    if: needs.build.outputs.publish == 'true' && needs.build.outputs.tuf == 'signed'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact
      - name: Unpack the site
        run: |
          mkdir "$RUNNER_TEMP/site"
          tar -xf "$RUNNER_TEMP/artifact/artifact.tar" -C "$RUNNER_TEMP/site"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: python-tuf over the assembled repository
        run: |
          python -m venv "$RUNNER_TEMP/tuf-oracle"
          "$RUNNER_TEMP/tuf-oracle/bin/pip" install --require-hashes -r xtask/assets/tuf-oracle/requirements.txt
          "$RUNNER_TEMP/tuf-oracle/bin/python" xtask/assets/tuf-oracle/verify_repo.py \
            --dir "$RUNNER_TEMP/site/tuf/v1" --root crates/oncl-update/keys/root.json \
            --index "$RUNNER_TEMP/site/updates/v1"

  deploy:
    needs: [build, oracle]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.oracle.result != 'failure' && needs.build.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # The smoke check after the deployment: the real client over HTTPS against the site. A
  # red run here is how an expired or broken timestamp reaches the owner (GitHub mails the
  # failure of a scheduled run).
  verify:
    needs: [build, deploy]
    if: needs.build.outputs.tuf == 'signed'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: pages
      # Pages caches files for ten minutes; a few tries cover the deployment's propagation.
      - name: Verify the published TUF repository
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4; do
            if cargo xtask tuf verify-published --url "${PAGE_URL%/}/tuf/v1/"; then
              exit 0
            fi
            echo "::warning::attempt $attempt failed"
            sleep 60
          done
          exit 1
