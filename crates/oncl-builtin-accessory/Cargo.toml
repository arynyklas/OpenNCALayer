[package]
name = "oncl-builtin-accessory"
description = "The kz.gov.pki.ncalayerservices.accessory module of OpenNCALayer as a built-in WebAssembly module: installed bundles, registered modules, bundle installation requests and the requests to open the daemon's windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# `rlib` only: its texts for the core's tools. The module the core embeds (wasm32) is the
# `cdylib` `oncl-builtins-build` asks for (`cargo rustc --crate-type cdylib`): a `cdylib` here
# would have no hash in its host file names, and the host builds of the workspace and of
# `cargo xtask`, with other features, would rebuild it and its dependents in turn.
crate-type = ["rlib"]

[dependencies]
oncl-pdk.workspace = true
serde_json.workspace = true
