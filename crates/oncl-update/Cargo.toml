[package]
name = "oncl-update"
description = "OpenNCALayer's update index: its model, minisign verification, the choice of a version and the updater's state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
keywords = ["update", "minisign", "signature", "release", "ncalayer"]
categories = ["cryptography"]
include = ["/src/**", "/build.rs", "/keys/**", "/LICENSE", "/NOTICE"]

[dependencies]
getrandom.workspace = true
minisign-verify.workspace = true
# `fsutil` (the state file, written atomically) and the `HttpTransport` the index is fetched
# through.
oncl-pki.workspace = true
# Ed25519 for the TUF verifier (`tuf::ed25519`); `oncl-pki` already has it.
ring.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["serde", "formatting", "parsing"] }
# The signing keys the repository tools generate are wiped when dropped.
zeroize.workspace = true
# `contents_sha256`: the files of a package.
zip.workspace = true

[build-dependencies]
# The key files are decoded at build time: a malformed one fails the build.
minisign-verify.workspace = true
# `keys/root.json` is checked at build time with the code of `src/tuf` that reads a root
# (`canonical`, `keys`, `model`, which need no signature algorithm).
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["parsing"] }

[dev-dependencies]
base64.workspace = true
minisign.workspace = true
tempfile.workspace = true
time = { workspace = true, features = ["macros"] }
